name: FoW VPS SSH audit (read-only)

# Either manually dispatch from GitHub Actions or let ChatGPT trigger with a
# small audit-requests/ file added via the GitHub connector. No deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit-requests/**'

permissions:
  contents: read
  issues: write # Only to post a sanitized result to issue #41.

concurrency:
  group: fow-vps-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit current VPS via a forced read-only SSH command
        id: ssh_audit
        shell: bash
        env:
          FOW_VPS_HOST: ${{ secrets.FOW_VPS_HOST }}
          FOW_VPS_USER: ${{ secrets.FOW_VPS_USER }}
          FOW_VPS_SSH_PRIVATE_KEY: ${{ secrets.FOW_VPS_SSH_PRIVATE_KEY }}
          FOW_VPS_SSH_KNOWN_HOSTS: ${{ secrets.FOW_VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in FOW_VPS_HOST FOW_VPS_USER FOW_VPS_SSH_PRIVATE_KEY FOW_VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing required secret: $required"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          keyfile="$(mktemp "$HOME/.ssh/fow-key.XXXXXX")"
          knownhosts="$(mktemp "$HOME/.ssh/fow-knownhosts.XXXXXX")"
          trap 'rm -f "$keyfile" "$knownhosts"' EXIT
          printf '%s\n' "$FOW_VPS_SSH_PRIVATE_KEY" > "$keyfile"
          printf '%s\n' "$FOW_VPS_SSH_KNOWN_HOSTS" > "$knownhosts"

          # The dedicated VPS account's authorized_keys forces only the
          # fixed fow-readonly-audit command. Arbitrary remote commands cannot run.
          ssh -T \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$knownhosts" \
            -o ConnectTimeout=15 \
            -i "$keyfile" \
            "$FOW_VPS_USER@$FOW_VPS_HOST" 'audit' > "$RUNNER_TEMP/fow-ssh-audit.txt"

          cat "$RUNNER_TEMP/fow-ssh-audit.txt"

      - name: Post sanitized audit result to GitHub issue 41
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.ssh_audit.outcome }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/fow-audit-issue.md"
          {
            printf '### FoW VPS remote audit — %s\n\n' "$AUDIT_OUTCOME"
            printf 'Workflow log: %s\n\n' "$AUDIT_RUN_URL"
            if [[ "$AUDIT_OUTCOME" == "success" && -f "$RUNNER_TEMP/fow-ssh-audit.txt" ]]; then
              printf '\`\`\`text\n'
              sed -n '1,15p' "$RUNNER_TEMP/fow-ssh-audit.txt"
              printf '\`\`\`\n'
            else
              printf 'Setup/SSH audit failed. No production changes were made. Review the workflow log.\n'
            fi
          } > "$report"
          gh issue comment 41 --repo "$GITHUB_REPOSITORY" --body-file "$report"
